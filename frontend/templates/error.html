<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Exception Encountered</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md text-center space-y-6">
        <div class="inline-flex bg-rose-950/40 border border-rose-900/40 p-4 rounded-2xl text-rose-400 shadow-lg text-3xl animate-pulse">
            <i class="fa-solid fa-circle-exclamation"></i>
        </div>
        
        <div class="space-y-2">
            <h1 class="text-2xl font-black text-white tracking-tight">System Exception Interrupted</h1>
            <p class="text-sm text-slate-400 max-w-xs mx-auto">
                The resource node requested is unavailable or execution logic timed out.
            </p>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-left font-mono text-xs text-slate-500">
            <span class="text-slate-400 font-bold">STATUS_CODE:</span> 404 / 500 Route Breakdown<br>
            <span class="text-slate-400 font-bold">COMPONENT:</span> AgentRuntimeExecutorNode
        </div>

        <div>
            <a href="/dashboard" class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-5 py-2.5 rounded-xl text-sm border border-slate-700 transition shadow-sm">
                <i class="fa-solid fa-house text-xs"></i> Return to Safety Hub
            </a>
        </div>
    </div>

</body>
</html>
